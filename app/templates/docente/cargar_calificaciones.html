{% extends "base.html" %}
{% block title %}Cargar calificaciones{% endblock %}
{% block content %}
<section class="card form-card">
  <header class="card__header">
    <div class="card__icon card__icon--gradient">
      <i class="fas fa-marker"></i>
    </div>
    <div>
      <h2>Registrar calificacion</h2>
      <p>Selecciona examen y alumno, e ingresa la nota correspondiente.</p>
    </div>
  </header>
  {% if success %}
  <div class="banner banner--success">
    {{ success }}
  </div>
  {% endif %}
  {% if error %}
  <div class="banner banner--error">
    {{ error }}
  </div>
  {% endif %}
  <form method="post" action="{{ request.url.path }}" class="form" data-loading="true">
    <div class="form-grid">
      <div class="form-group">
        <label for="examen_id"><i class="fas fa-file-signature"></i> Examen</label>
        <select id="examen_id" name="examen_id" required>
          <option value="">Elegir examen...</option>
          {% for examen in examenes %}
          <option value="{{ examen.id }}">{{ examen.nombre }} - {{ examen.materia_id }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="alumno_id"><i class="fas fa-user-graduate"></i> Alumno</label>
        <select id="alumno_id" name="alumno_id" required>
          <option value="">Elegir alumno...</option>
          {% for alumno in alumnos %}
          <option value="{{ alumno.id }}">{{ alumno.nombre }} - {{ alumno.email }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="nota"><i class="fas fa-star-half-stroke"></i> Nota</label>
        <input id="nota" type="number" step="0.1" min="0" max="10" name="nota" placeholder="Ej. 9.5" required />
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-share-from-square"></i>
        Guardar calificacion
      </button>
    </div>
  </form>
</section>
{% endblock %}
