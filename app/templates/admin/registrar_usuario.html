{% extends "base.html" %}
{% block title %}Registrar usuarios{% endblock %}
{% block content %}
<section class="card form-card">
  <header class="card__header">
    <div class="card__icon">
      <i class="fas fa-user-plus"></i>
    </div>
    <div>
      <h2>Crear un nuevo usuario</h2>
      <p>Completa la informacion base para habilitar el acceso.</p>
    </div>
  </header>
  <form method="post" action="{{ request.url.path }}" class="form" data-loading="true">
    <div class="form-grid">
      <div class="form-group">
        <label for="nombre"><i class="fas fa-id-badge"></i> Nombre completo</label>
        <input id="nombre" type="text" name="nombre" placeholder="Nombre y apellido" required />
      </div>
      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Correo</label>
        <input id="email" type="email" name="email" placeholder="nombre@institucion.edu" required />
      </div>
      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
        <input id="password" type="password" name="password" placeholder="********" required />
      </div>
      <div class="form-group">
        <label for="tipo"><i class="fas fa-users-gear"></i> Rol</label>
        <select id="tipo" name="tipo" required>
          <option value="alumno">Alumno</option>
          <option value="docente">Docente</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save"></i>
        Guardar usuario
      </button>
    </div>
  </form>
</section>
{% endblock %}
