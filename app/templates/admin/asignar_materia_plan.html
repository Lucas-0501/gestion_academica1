{% extends "base.html" %}
{% block title %}Asignar materias{% endblock %}
{% block content %}
<section class="card form-card">
  <header class="card__header">
    <div class="card__icon">
      <i class="fas fa-sitemap"></i>
    </div>
    <div>
      <h2>Asignar materias al plan seleccionado</h2>
      <p>Selecciona un plan y las materias que formaran parte del trayecto.</p>
    </div>
  </header>
  <form method="post" action="{{ request.url.path }}" class="form" data-loading="true">
    <div class="form-grid">
      <div class="form-group form-group--full">
        <label for="plan_id"><i class="fas fa-diagram-project"></i> Plan academico</label>
        <select id="plan_id" name="plan_id" required>
          <option value="">Elegir plan...</option>
          {% for plan in planes %}
          <option value="{{ plan.id }}">{{ plan.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group form-group--full">
        <label for="materias_ids"><i class="fas fa-book-open"></i> Materias disponibles</label>
        <select id="materias_ids" name="materias_ids" multiple size="8">
          {% for materia in materias %}
          <option value="{{ materia.id }}">{{ materia.nombre }} ({{ materia.codigo }})</option>
          {% endfor %}
        </select>
        <small>Usa CTRL o CMD para seleccionar mas de una materia.</small>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-link"></i>
        Asociar materias
      </button>
    </div>
  </form>
</section>
{% endblock %}
